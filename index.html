<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Fish</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">Score: 0</div>
        <div id="startScreen">
            <h1>🐠 Flappy Fish</h1>
            <p>Help the fish swim through the pipes! Avoid hitting them or you'll lose!</p>
            <p>Tap or press space to swim!</p>
            <button onclick="startGame()">Start Game</button>
        </div>
        <div id="gameOver">
            <h1>Fish 🐠 Over</h1>
            <p>Your Score: <span id="finalScore"></span></p>
            <button onclick="restartGame()">Restart</button>
        </div>
        <div id="offline">
            <h2>No Internet Connection</h2>
            <p>Please check your connection and try again.</p>
        </div>
    </div>
    <audio id="bgMusic" loop>
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>
    <audio id="flapSound">
        <source src="fish-sound.lnk" type="audio/mpeg">
    </audio>
    <audio id="hitSound">
        <source src="hit-sound.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js"></script>
</body>
</html>
